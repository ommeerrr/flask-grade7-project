<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .score-card {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: #6c757d;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body class="bg-light">
    <div class="score-card card shadow">
        <div class="card-body text-center">
            <h2 class="text-success">Your Score</h2>
            <p class="lead">You got <strong>{{ score }}</strong> out of 5 questions right!</p>
            <a href="{{ url_for('quiz') }}" class="back-btn">← Take Another Quiz</a>
        </div>
    </div>
</body>
</html>
