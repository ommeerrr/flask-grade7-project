<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Quiz</h1>
    <form id="quizForm">
        {% for q in questions %}
        <div class="question">
            <p><strong>{{ q.id }}</strong>: {{ q.instruction }}</p>
            <p>{{ q.input }}</p>
            
            {% if q.type == "Multiple Choice" %}
                {% for option in q.options %}
                <label class="option-label">
                    <input type="radio" name="{{ q.instruction }}" value="{{ option }}">
                    {{ option }}
                </label><br>
                {% endfor %}
            {% endif %}
        </div>
        {% endfor %}
        
        <button type="button" onclick="submitQuiz()">Submit</button>
        <a href="{{ url_for('home') }}" class="back-btn">← Back to Home</a>
    </form>

    <script>
        async function submitQuiz() {
            const answers = {};
            const form = document.getElementById("quizForm");
            
            form.querySelectorAll("input[type='radio']:checked").forEach(input => {
                answers[input.name] = {
                    answer: input.value,
                    type: "Multiple Choice"
                };
            });
            
            const response = await fetch("/check_answers", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(answers)
            });
            
            const results = await response.json();
            window.location.href = `/result?score=${results.score}`;
        }
    </script>
</body>
</html>
